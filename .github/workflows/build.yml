name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar secrets.json a partir dos GitHub Secrets
        run: |
          cat <<EOF > secrets.json
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Corrigir versões do Kotlin e Gradle no projeto Android
        run: |
          # Atualiza o plugin do Kotlin para 1.9.24 ou compatível com Gradle moderno em todos os arquivos gradle
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/1\.4\.[0-9]/1.9.24/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/version "1\.4"/version "1.9.24"/g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/kotlin_version = "1\.[0-4]/kotlin_version = "1.9.24/g' {} +
          
          # Garante compilação com Java 17 no gradle.properties se existir
          if [ -f "android/gradle.properties" ]; then
            echo "android.enableJetifier=true" >> android/gradle.properties
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

      - name: Build APK (release)
        run: flutter build apk --release --dart-define-from-file=secrets.json --android-skip-build-dependency-validation

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
