name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Instalar dependências
        run: flutter pub get

      - name: Criar secrets.json a partir dos GitHub Secrets
        run: |
          cat <<EOF > secrets.json
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Forçar versão do Kotlin para 1.8.22 em todo o projeto
        run: |
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec sed -i 's/version "1\.[0-4]"/version "1.8.22"/g' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec sed -i 's/kotlin-android", version = "1\.[0-4]"/kotlin-android", version = "1.8.22"/g' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -exec sed -i 's/kotlin_version = "1\.[0-4]"/kotlin_version = "1.8.22"/g' {} +

      - name: Build APK (release)
        run: flutter build apk --release --dart-define-from-file=secrets.json --android-skip-build-dependency-validation

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
