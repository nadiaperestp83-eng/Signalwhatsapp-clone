name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Limpar cache e instalar dependências
        run: |
          flutter clean
          flutter pub cache clean --force
          flutter pub get

      - name: Criar secrets.json a partir dos GitHub Secrets
        run: |
          cat <<EOF > secrets.json
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "SIGNAL_BRIDGE_URL": "${{ secrets.SIGNAL_BRIDGE_URL }}"
          }
          EOF

      - name: Build APK (release)
        run: flutter build apk --release --dart-define-from-file=secrets.json

      - name: Upload do APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
