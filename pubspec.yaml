name: whatsapp_clone
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🔐 Motor Criptográfico do Casulo
  libsignal_protocol_dart: ^0.6.2
  supabase_flutter: ^2.6.0
  webview_flutter: ^4.9.0
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_contacts: ^1.1.9+2

  cupertino_icons: ^1.0.6
  country_picker: ^2.0.26
  flutter_launcher_icons: ^0.13.1
  app_links: ^6.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/app-icon.png"
  adaptive_icon_background: "assets/img/app-adaptive-bg.png"
  adaptive_icon_foreground: "assets/img/icon-foreground.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/dps/
    - assets/img/channels/
